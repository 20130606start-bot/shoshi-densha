<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="電車モード">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>司法書士 電車モード（オフライン）</title>
<style>
  :root{
    --bg:#0f1420; --card:#182131; --card2:#1e293b; --line:#2a3852; --fg:#e8eef7; --sub:#9fb0c8;
    --maru:#22c55e; --batsu:#ef4444; --accent:#3b82f6; --accent2:#1d4ed8; --warn:#f59e0b;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif; }
  body{ padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .wrap{ max-width:560px; margin:0 auto; padding:0 14px 40px; }
  header{ position:sticky; top:0; z-index:10; background:rgba(15,20,32,.94); backdrop-filter:blur(8px);
    padding:calc(env(safe-area-inset-top) + 6px) 14px 0; margin:0 -14px 12px; border-bottom:1px solid var(--line); }
  .topbar{ display:flex; align-items:center; gap:10px; padding-bottom:8px; }
  .prog{ flex:1; font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .subjbtn{ background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:999px;
    padding:6px 14px; font-size:14px; font-weight:800; max-width:48%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .subjbtn:active{ transform:scale(.96); }
  .panel{ padding:10px 0 12px; border-top:1px dashed var(--line); }
  .hbar{ height:3px; background:var(--card); overflow:hidden; margin:0 -14px; }
  .status{ font-size:12px; color:var(--sub); margin-bottom:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .dot.on{ background:var(--maru); } .dot.off{ background:var(--warn); }
  button{ font-family:inherit; cursor:pointer; }
  .iconbtn{ background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:10px;
    padding:8px 12px; font-size:14px; font-weight:700; }
  .iconbtn:active{ transform:scale(.96); }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px; -webkit-overflow-scrolling:touch; }
  .chip{ flex:0 0 auto; background:var(--card); color:var(--sub); border:1px solid var(--line);
    border-radius:999px; padding:7px 14px; font-size:13px; font-weight:700; white-space:nowrap; }
  .chip.on{ background:var(--accent2); color:#fff; border-color:var(--accent); }
  .toolrow{ display:flex; align-items:center; gap:10px; margin:2px 0 0; }
  .toolrow .grow{ flex:1; color:var(--sub); font-size:13px; }
  .seg{ display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button{ background:none; border:none; color:var(--sub); padding:7px 12px; font-size:13px; font-weight:700; }
  .seg button.on{ background:var(--card2); color:var(--fg); }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; }
  .meta{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .qname{ font-size:12px; color:var(--sub); font-weight:700; }
  .badge{ font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--card2); color:var(--sub); }
  /* 前提＝肢の上に小さく出す設問文（本体アプリ v137 の .zentei と同じ役目）。
     本文(.bun)より一段小さく・薄くする。ここが本文と同じ大きさだと、どちらが問いか分からなくなる。
     電車は片手・揺れる場所なので、本体(13px)より大きい18pxにしてある。 */
  .zentei{ font-size:18px; line-height:1.7; color:var(--sub); background:var(--card2);
    border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:10px; padding:10px 12px; margin-bottom:12px; white-space:pre-wrap; word-break:break-word; }
  .zentei b{ display:block; font-size:12px; font-weight:800; color:var(--fg); margin-bottom:4px; letter-spacing:.05em; }
  .bun{ font-size:34px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .ansrow{ display:flex; gap:12px; margin-top:18px; }
  .ansbtn{ flex:1; border:2px solid var(--line); background:var(--card2); color:var(--fg);
    border-radius:14px; padding:16px 0; font-size:24px; font-weight:800; }
  .ansbtn.maru{ border-color:rgba(34,197,94,.5); } .ansbtn.batsu{ border-color:rgba(239,68,68,.5); }
  .ansbtn.pick.maru{ background:rgba(34,197,94,.18); border-color:var(--maru); }
  .ansbtn.pick.batsu{ background:rgba(239,68,68,.18); border-color:var(--batsu); }
  .ansbtn.dim{ opacity:.4; }
  .ansbtn:active{ transform:scale(.98); }
  .ansbtn .sub{ display:block; font-size:11px; font-weight:700; color:var(--sub); margin-top:4px; }

  .reveal{ margin-top:16px; }
  .verdict{ font-size:20px; font-weight:900; padding:12px; border-radius:12px; text-align:center; margin-bottom:14px; }
  .verdict.ok{ background:rgba(34,197,94,.15); color:#5ee89b; }
  .verdict.ng{ background:rgba(239,68,68,.15); color:#ff8a8a; }
  .lbl{ font-size:14px; font-weight:800; color:var(--sub); margin:14px 0 6px; letter-spacing:.03em; }
  .block{ background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font-size:22px; line-height:1.75; white-space:pre-wrap; word-break:break-word; }
  .block.reason{ border-color:rgba(34,197,94,.35); }
  .block.empty{ color:var(--sub); font-style:normal; }
  /* 手応え（本体アプリ v130/v136 の4段を電車モードにも・2026-08-16）
     並び・色・2×2は本体と**完全に同じ**にする（画面が変わっても親指の位置が変わらない）。
     電車の中は片手なので、本体より一回り大きくしてある。
     ここで押したものは端末に貯まり、電波が入ったら本体の「手応え」シートへ足される
     ＝軌跡（点の列・とどまりの番号）は**家のアプリで**伸びる。電車では出さない（社長判断 2026-08-16）。 */
  .tegotae{ margin:2px 0 14px; }
  .tegotae .tg-q{ font-size:14px; color:var(--sub); margin-bottom:8px; }
  .tegotae .tg-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tegotae button{ font-family:inherit; font-size:17px; font-weight:700; cursor:pointer;
    background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:16px 2px; }
  .tegotae button:active{ transform:scale(.98); }
  .tegotae button.on{ color:#0d1117; font-weight:800; }
  .tegotae button.on.w{ background:#8ed6b0; border-color:#8ed6b0; }   /* わかった */
  .tegotae button.on.c{ background:#bcd98a; border-color:#bcd98a; }   /* ちょっとわかった */
  .tegotae button.on.a{ background:#e3c06a; border-color:#e3c06a; }   /* あやしい */
  .tegotae button.on.n{ background:#b8a0d8; border-color:#b8a0d8; }   /* わからない（✕の赤とは別色） */
  .nav{ display:flex; gap:12px; margin-top:8px; }
  .nav button{ flex:1; border:none; border-radius:14px; padding:15px 0; font-size:16px; font-weight:800; }
  .prev{ background:var(--card2); color:var(--sub); border:1px solid var(--line)!important; }
  .next{ background:var(--accent2); color:#fff; }
  .next:active,.prev:active{ transform:scale(.98); }
  .barfill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--maru)); width:0%; transition:width .25s; }
  .notice{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; text-align:center;
    color:var(--sub); font-size:15px; line-height:1.7; }
  .wrow{ display:block; width:100%; text-align:left; background:var(--card2); color:var(--fg);
    border:1px solid rgba(239,68,68,.35); border-radius:12px; padding:10px 12px; margin-top:8px;
    font-size:16px; line-height:1.6; }
  .wrow:active{ transform:scale(.98); }
  .wrow .wname{ display:block; font-size:13px; font-weight:800; color:var(--sub); }
  .notice b{ color:var(--fg); }
  .spin{ display:inline-block; width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:sp .8s linear infinite; vertical-align:-3px; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .hidden{ display:none!important; }
  .foot{ text-align:center; color:var(--sub); font-size:11px; margin-top:24px; opacity:.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <span class="prog" id="progText">🚃 電車モード</span>
      <button class="subjbtn" id="subjBtn">メニュー ▾</button>
    </div>
    <div class="panel hidden" id="panel">
      <div class="seg" id="setSeg" style="margin-bottom:10px;">
        <button data-set="r7" class="on">令和7</button>
        <button data-set="r6">令和6</button>
      </div>
      <div class="status">
        <span class="dot" id="netDot"></span>
        <span id="statusText">読み込み中…</span>
      </div>
      <div class="status" id="syncInfo"></div>
      <div class="chips" id="subjChips"></div>
      <div class="toolrow">
        <span class="grow" id="countText"></span>
        <div class="seg" id="orderSeg">
          <button data-mode="order" class="on">出題順</button>
          <button data-mode="shuffle">シャッフル</button>
        </div>
        <!-- 2026-08-19 社長の依頼＝「◯が2回付いていない肢を連続でやりたい」。
             並び方（上）とは別の軸なので、別のセグにする。 -->
        <div class="seg" id="onlySeg">
          <button data-only="all" class="on">ぜんぶ</button>
          <button data-only="yet">◯2回未満</button>
          <button data-only="reason">根拠だけ</button>
        </div>
        <button class="iconbtn" id="resultBtn">📊 リザルト</button>
        <button class="iconbtn" id="refreshBtn">🔄 更新</button>
      </div>
    </div>
    <div class="hbar"><div class="barfill" id="barFill"></div></div>
  </header>

  <div id="controls" class="hidden">
    <div id="cardHost"></div>
  </div>

  <div id="notice" class="notice">
    <span class="spin"></span> 問題を読み込んでいます…
  </div>

  <div class="foot" id="foot">オフラインでも、保存済みの問題は解けます。電波がある時に「🔄更新」で最新化。</div>
</div>

<script>
/* ===== 設定 ===== */
/* 版数。sw.js の CACHE と**同じ番号**にする（densha-deploy.js が両方まとめて上げる）。
   画面の下に出るので、社長が「新しい版が来たか」を目で確かめられる。 */
var BUILD = 'v14';
var PACK_URL = 'https://script.google.com/macros/s/AKfycbwranP76xx9S8eiwgI35jO9mJe07evi9THjL4UPiO-KVwQ4i2x0mfLQ62tngvXwCb9dIQ/exec';
var INBOX_URL = 'https://script.google.com/macros/s/AKfycbwsJlVtrxz0qFrs1wM7C2bRbhObPywfxuk3OgW1ilWAVNEGTlepEtvFZ193x_CaRlY-/exec';
var INBOX_TOKEN = '5jsygj297tgspvjqe3gimz40t7evvw7ud4rep5c9';
var LS_PACK = 'shoshi_pack_v1';
var LS_AT   = 'shoshi_pack_at_v1';
var LS_PREF = 'shoshi_pref_v1';
var LS_Q    = 'shoshi_queue_v1';   // 未送信の解答（本体へ同期待ち）
var LS_TQ   = 'shoshi_tq_v1';      // 未送信の手応え（同上・2026-08-16）
var LS_DAY  = 'shoshi_day_v1';     // きょう解いた数（端末表示用）
var LS_SESS = 'shoshi_sess_v1';    // きょうの解答ログ（リザルト・間違い復習用）

/* ===== 状態 ===== */
var SETS_UI = { r7:{label:'令和7', short:'令7'}, r6:{label:'令和6', short:'令6'} };
var curSet = 'r7';         // 選択中セット（端末に保存）
var pack = null;          // {dataset,set,generatedAt,count,items:[]}
var subject = '全';
var order = 'order';       // 'order' | 'shuffle'
/* 出す肢の絞り込み（2026-08-19）
   'all'    … ぜんぶ（これまでどおり）
   'yet'    … **◯が2回付いていない肢だけ**（社長の依頼）
              ＝ 消灯でもなく、「あと一歩（根拠だけ足りない）」でもない肢。
              本体アプリの「科目別で解くモード」と同じ集合になる（getSubjectRemaining）
   'reason' … ◯は2回付いていて**根拠だけ足りない**肢（家で書くもの／電車では読んで思い出す用）
   判定に使う印は、パックの st（状態）と act（あと一歩の内訳）。 */
var only = 'all';
var list = [];             // 現在の出題リスト
var idx = 0;
var answered = 0, correct = 0;
function packKey(){ return curSet==='r7' ? LS_PACK : 'shoshi_pack_'+curSet+'_v1'; }  // r7は旧キー＝既存端末の保存分をそのまま使う
function atKey(){ return curSet==='r7' ? LS_AT : 'shoshi_pack_at_'+curSet+'_v1'; }

/* ===== ユーティリティ ===== */
function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function fmtTime(iso){
  try{ var d=new Date(iso); var p=function(n){return (n<10?'0':'')+n;};
    return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes()); }catch(e){ return ''; }
}
function loadPref(){ try{ var p=JSON.parse(localStorage.getItem(LS_PREF)||'{}'); if(p.subject) subject=p.subject; if(p.order) order=p.order; if(p.only) only=p.only; if(p.set && SETS_UI[p.set]) curSet=p.set; }catch(e){} }
function savePref(){ try{ localStorage.setItem(LS_PREF, JSON.stringify({subject:subject, order:order, only:only, set:curSet})); }catch(e){} }

/* ===== パック取得（JSONP：CORS回避・GASと相性◎） ===== */
function fetchPack(done){
  var cbName='__shoshiPackCb';
  var s=document.createElement('script');
  var finished=false;
  var to=setTimeout(function(){ finish(new Error('timeout')); }, 20000);
  function cleanup(){ clearTimeout(to); try{ delete window[cbName]; }catch(e){ window[cbName]=null; } if(s.parentNode) s.parentNode.removeChild(s); }
  function finish(err, data){ if(finished) return; finished=true; cleanup(); done(err, data); }
  window[cbName]=function(data){ finish(null, data); };
  s.onerror=function(){ finish(new Error('network')); };
  s.src=PACK_URL+'?set='+curSet+'&callback='+cbName+'&t='+Date.now();
  document.head.appendChild(s);
}
function savePack(p){
  try{ localStorage.setItem(packKey(), JSON.stringify(p)); localStorage.setItem(atKey(), new Date().toISOString()); return true; }
  catch(e){ return false; } // 容量オーバー等
}

/* ===== 解答の蓄積と本体への同期（Phase 2） =====
 * 解いた結果を端末(localStorage)に貯め、電波があるとき受信箱GASへ自動送信。
 * 受信箱は本体の「解答記録」へ追記する＝消灯・降格・継続スタンプに効く。
 * 送信失敗・オフラインでは貯めたまま（消えない）。重複はバッチIDでサーバー側が弾く。 */
function readQ(){ try{ return JSON.parse(localStorage.getItem(LS_Q)||'[]'); }catch(e){ return []; } }
function writeQ(q){ try{ localStorage.setItem(LS_Q, JSON.stringify(q.slice(-3000))); }catch(e){} }
function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function readDay(){
  try{ var v=JSON.parse(localStorage.getItem(LS_DAY)||'{}'); if(v.d===todayKey()) return v; }catch(e){}
  return { d: todayKey(), n: 0, ok: 0 };
}
function bumpDay(ok){ var v=readDay(); v.n++; if(ok) v.ok++; try{ localStorage.setItem(LS_DAY, JSON.stringify(v)); }catch(e){} }
function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function recordLocal(qi, my, ok){
  var q=readQ();
  q.push({ id: newId(), t: new Date().toISOString(), set: curSet, name: qi.name, eda: qi.eda, my: my });
  writeQ(q); bumpDay(ok); pushSess(qi, my, ok); updateSyncInfo(); scheduleSync();
}

/* ===== 手応え（4段・2026-08-16）=================================================
 * 本体アプリ(v130/v136)と同じ4段を電車モードでも押せるようにした。
 *   ・**押さなくてよい**（必須にすると解くのが重くなる）。押し直せる＝最後のタップが今の手応え
 *   ・解答と同じく端末に貯めて、電波が入ったら受信箱GASへ送る＝オフラインでも消えない
 *   ・重複は id で受信箱が弾く（解答と同じ仕掛け。ただし突き合わせ先が違うので**別の口**）
 *   ・軌跡（点の列・とどまりの番号）は**ここには出さない**（社長判断 2026-08-16）。
 *     オフラインでは「いまの段」を取りに行けないので、出せば必ず古い数字になる。
 *     軌跡は家のアプリで伸びる＝電車では「押せること」だけを持ち込む。 */
var TEG=[['wakaranai','わからない','n'],['ayashii','あやしい','a'],
         ['chotto','ちょっとわかった','c'],['wakatta','わかった','w']];
function readTQ(){ try{ return JSON.parse(localStorage.getItem(LS_TQ)||'[]'); }catch(e){ return []; } }
function writeTQ(q){ try{ localStorage.setItem(LS_TQ, JSON.stringify(q.slice(-3000))); }catch(e){} }
function recordTegotaeLocal(qi, lv){
  var q=readTQ();
  q.push({ id: newId(), t: new Date().toISOString(), set: curSet, name: qi.name, eda: qi.eda, lv: lv });
  writeTQ(q); updateSyncInfo(); scheduleSync();
}
/** 手応えの4マス（本体と同じ並び・同じ色・同じ読む順＝低い→高い） */
function tegotaeBox(qi){
  var box=el('div','tegotae');
  box.appendChild(el('div','tg-q','いまの手応えは？（押さなくても進めます）'));
  var row=el('div','tg-row');
  TEG.forEach(function(t){
    var b=el('button',null,t[1]);
    b.onclick=function(){
      Array.prototype.forEach.call(row.children, function(x){ x.className=''; });
      b.className='on '+t[2];
      recordTegotaeLocal(qi, t[0]);
    };
    row.appendChild(b);
  });
  box.appendChild(row);
  return box;
}

/* ===== きょうのリザルト（セッションログ・端末内だけで完結） ===== */
function readSess(){
  try{ var v=JSON.parse(localStorage.getItem(LS_SESS)||'{}'); if(v.d===todayKey() && Array.isArray(v.log)) return v; }catch(e){}
  return { d: todayKey(), log: [] };
}
function pushSess(qi, my, ok){
  var v=readSess();
  v.log.push({ set: curSet, name: qi.name, eda: qi.eda, my: my, ok: !!ok });
  if(v.log.length>500) v.log=v.log.slice(-500);
  try{ localStorage.setItem(LS_SESS, JSON.stringify(v)); }catch(e){}
}
/** きょう間違えたままの肢（選択中セット分。同じ肢を解き直して正解したら消える）。出会った順。 */
function wrongsNow(){
  var latest={}, order=[];
  readSess().log.forEach(function(r){
    if((r.set||'r7')!==curSet) return;
    var k=r.name+'|'+r.eda;
    if(!(k in latest)) order.push(k);
    latest[k]=r.ok;
  });
  return order.filter(function(k){ return !latest[k]; });
}
function packIndex_(){
  var m={};
  if(pack && pack.items) pack.items.forEach(function(q){ m[q.name+'|'+q.eda]=q; });
  return m;
}

/* 汎用JSONP（fetchPackと同方式・コールバック名は連番で衝突回避） */
var __jsonpSeq=0;
function jsonp(url, done){
  var cbName='__shoshiCb'+(++__jsonpSeq);
  var s=document.createElement('script');
  var finished=false;
  var to=setTimeout(function(){ finish(new Error('timeout')); }, 15000);
  function cleanup(){ clearTimeout(to); try{ delete window[cbName]; }catch(e){ window[cbName]=null; } if(s.parentNode) s.parentNode.removeChild(s); }
  function finish(err, data){ if(finished) return; finished=true; cleanup(); done(err, data); }
  window[cbName]=function(data){ finish(null, data); };
  s.onerror=function(){ finish(new Error('network')); };
  s.src=url+'&callback='+cbName;
  document.head.appendChild(s);
}

var syncTimer=null, syncing=false;
function scheduleSync(){ if(syncTimer) clearTimeout(syncTimer); syncTimer=setTimeout(syncNow, 4000); }
/** 送っていい状態か。ローカル起動では偽の記録を本体に送らない（?sync=1 で明示解除） */
function canSend_(){
  if(/^(localhost|127\.)/.test(location.hostname) && location.search.indexOf('sync=1')<0){ updateSyncInfo('（ローカル・送信オフ）'); return false; }
  if(syncing || !navigator.onLine || !INBOX_URL){ updateSyncInfo(); return false; }
  return true;
}
function syncNow(){
  if(!canSend_()) return;
  var q=readQ(); if(!q.length){ syncTegNow(); return; }   // 解答が無ければ手応えだけ送る
  var recs=q.slice(0,40);
  var batch=recs[0].id+'_'+recs.length; // 受信ログの見出し用。重複排除はサーバーがレコードのidで行う
  // キューの中身はそのまま全部送る。id（重複排除の鍵）と set（年度）を落とすと壊れる
  var payload=recs.map(function(r){ return {id:r.id, t:r.t, set:(r.set||'r7'), name:r.name, eda:r.eda, my:r.my}; });
  syncing=true; updateSyncInfo('送信中…');
  jsonp(INBOX_URL+'?token='+INBOX_TOKEN+'&batch='+encodeURIComponent(batch)+'&data='+encodeURIComponent(JSON.stringify(payload)), function(err,res){
    syncing=false;
    if(err || !res || !res.ok){ updateSyncInfo(); return; } // 失敗→貯めたまま次の機会に
    var sent={}; recs.forEach(function(r){ sent[r.id]=1; });
    writeQ(readQ().filter(function(r){ return !sent[r.id]; }));
    updateSyncInfo();
    if(readQ().length) setTimeout(syncNow, 500); // 残りがあれば続けて送る
    else syncTegNow();                           // 解答を送り切ったら手応えを送る
  });
}
/** 手応えを送る（?tdata= の別口）。解答と同じ作り＝失敗しても貯めたまま消えない。 */
function syncTegNow(){
  if(!canSend_()) return;
  var q=readTQ(); if(!q.length){ updateSyncInfo(); return; }
  var recs=q.slice(0,40);
  var batch=recs[0].id+'_t'+recs.length;
  var payload=recs.map(function(r){ return {id:r.id, t:r.t, set:(r.set||'r7'), name:r.name, eda:r.eda, lv:r.lv}; });
  syncing=true; updateSyncInfo('送信中…');
  jsonp(INBOX_URL+'?token='+INBOX_TOKEN+'&batch='+encodeURIComponent(batch)+'&tdata='+encodeURIComponent(JSON.stringify(payload)), function(err,res){
    syncing=false;
    if(err || !res || !res.ok){ updateSyncInfo(); return; }
    var sent={}; recs.forEach(function(r){ sent[r.id]=1; });
    writeTQ(readTQ().filter(function(r){ return !sent[r.id]; }));
    updateSyncInfo();
    if(readTQ().length) setTimeout(syncTegNow, 500);
  });
}
function updateSyncInfo(extra){
  var elx=$('syncInfo'); if(!elx) return;
  var day=readDay(), qn=readQ().length+readTQ().length;   // 解答と手応えを合わせた「未送信」
  var t='きょう '+day.n+'問（正解 '+day.ok+'）';
  if(extra) t+='　'+extra;
  else if(qn>0) t+='　／　未送信 '+qn+'件'+(navigator.onLine?'':'（電波復帰で自動送信）');
  else if(day.n>0) t+='　／　✅ 本体へ送信済み';
  elx.textContent=t;
}
function readStoredPack(){
  try{ var raw=localStorage.getItem(packKey()); return raw? JSON.parse(raw): null; }catch(e){ return null; }
}

/* ===== 画面：状態表示 ===== */
function setStatus(text, online){
  $('statusText').innerHTML=text;
  var dot=$('netDot'); dot.className='dot '+(online?'on':'off');
}

/* ===== 古いデータの見分け（2026-08-19夜）=====
   社長「今日やったが、令和6 肢の問題 **前提なし** 困ったよ」。
   原因は前提が無いことではなく、**端末に入っているパックが古い**こと。
   前提は8/18から、状態の印(st)は8/19から配っている。**電車の中はオフラインなので取り直せない。**
   → ①古いと分かったら、オンラインなら黙って取り直す ②オフラインなら「なぜ出ないか」を画面に出す
   （黙って前提が出ないと、社長には壊れているのか未実装なのか区別できない）。 */
function packIsOld_(p){
  if(!p || !p.items || !p.items.length) return false;
  return !p.items[0].st;      // st が無い＝8/19より前に取り込んだパック
}
function warnOldPack_(){
  var el2=$('syncInfo');
  if(!el2) return;
  el2.innerHTML = navigator.onLine
    ? '⏳ データが古いので取り直しています…'
    : '⚠ このデータは古い版です（<b>前提が入っていません</b>）。電波のある所で開けば自動で入ります。';
}

/* ===== 起動 ===== */
function boot(){
  loadPref();
  pack = readStoredPack();
  if(pack && pack.items && pack.items.length){
    startWith(pack, true);   // まず保存分ですぐ解ける状態に
    if(packIsOld_(pack)) warnOldPack_();
  }
  // オンラインなら最新取得を試みる
  if(navigator.onLine){
    tryRefresh(!pack);       // packが無い初回は「取得中」を前面に
  } else if(!pack){
    showFirstRunOffline();
  }
}

function showFirstRunOffline(){
  $('controls').classList.add('hidden');
  $('notice').classList.remove('hidden');
  $('notice').innerHTML='📵 いまオフラインです。<br>この端末にはまだ問題が保存されていません。<br><br><b>一度だけ、電波がある場所でこのページを開いてください。</b><br>その後はオフラインでも解けるようになります。';
  setStatus('オフライン（未取込）', false);
}

function tryRefresh(foreground){
  if(foreground){ $('notice').innerHTML='<span class="spin"></span> 問題を取得しています…'; $('notice').classList.remove('hidden'); }
  setStatus('<span class="spin"></span> 取得中…', true);
  fetchPack(function(err, data){
    if(err || !data || !data.items){
      // 取得失敗：保存分があればそれで続行
      var at=localStorage.getItem(atKey());
      if(pack){ setStatus('保存済みで学習中（最終取込 '+fmtTime(at)+'）', navigator.onLine); }
      else { setStatus('取得できませんでした。電波を確認して🔄更新を', navigator.onLine); if(foreground) showFetchError(); }
      return;
    }
    var ok=savePack(data);
    pack=data;
    startWith(pack, false);
    updateSyncInfo();   // 「古い版です」の断りを消す（もう新しいのが入った）
    setStatus('最新に更新しました（'+data.count+'問・'+fmtTime(new Date().toISOString())+'）'+(ok?'':'　※保存容量オーバー'), true);
  });
}

function showFetchError(){
  $('controls').classList.add('hidden');
  $('notice').classList.remove('hidden');
  openPanel();
  $('notice').innerHTML='⚠️ 問題を取得できませんでした。<br>電波を確認して、上の<b>🔄更新</b>を押してみてください。<br><small style="color:var(--sub)">（配信口の初期設定が未完了の可能性もあります）</small>';
}

/* ===== 出題リスト構築 ===== */
var reviewMode=false;   // true=きょうの間違いだけを解き直すモード
function subjects(){
  var seen={}, arr=[];
  pack.items.forEach(function(q){ if(!seen[q.subject]){ seen[q.subject]=1; arr.push(q.subject); } });
  return arr;
}
/** ◯が2回付いているか（消灯／根拠だけ足りない）。**印の無い古いパックでは常に false**＝全部出す */
function twoMaru_(q){ return q.st==='消灯' || (q.st==='あと一歩' && q.act==='根拠'); }
/** きょう、この端末で正解した肢。パックの印は🔄更新まで変わらないので、
    これを外さないと**さっき正解した肢がすぐまた出る**（2026-08-19）。 */
function okToday_(){
  var m={};
  readSess().log.forEach(function(r){ if((r.set||'r7')===curSet && r.ok) m[r.name+'|'+r.eda]=1; });
  return m;
}
function buildList(){
  reviewMode=false;
  var hasMark = !!(pack.items.length && pack.items[0].st);   // 古いパックには st が無い
  var okd = (only==='yet') ? okToday_() : {};
  list = pack.items.filter(function(q){
    if(!(subject==='全' || q.subject===subject)) return false;
    if(only==='all' || !hasMark) return true;
    if(only==='yet')    return !twoMaru_(q) && !okd[q.name+'|'+q.eda];
    if(only==='reason') return q.st==='あと一歩' && q.act==='根拠';
    return true;
  });
  if(order==='shuffle'){
    for(var i=list.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=list[i]; list[i]=list[j]; list[j]=t; }
  }
  idx=0;
}

function startWith(p, keepIdx){
  pack=p;
  $('notice').classList.add('hidden');
  $('controls').classList.remove('hidden');
  renderChips();
  renderOrderSeg();
  renderOnlySeg();
  setSubjBtn();
  buildList();
  render();
}

/* ===== 上部メニュー（科目 ▾）の開閉 ===== */
function openPanel(){ $('panel').classList.remove('hidden'); }
function closePanel(){ $('panel').classList.add('hidden'); }
function setSubjBtn(){ $('subjBtn').textContent = (pack? subject: 'メニュー')+' ▾'; }

/* ===== セット（年度）切替 ===== */
function renderSetSeg(){
  Array.prototype.forEach.call($('setSeg').querySelectorAll('button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-set')===curSet);
    b.onclick=function(){ switchSet(b.getAttribute('data-set')); };
  });
}
function switchSet(k){
  if(!SETS_UI[k] || k===curSet) return;
  curSet=k; savePref(); renderSetSeg();
  pack=readStoredPack();
  if(pack && pack.items && pack.items.length){
    if(subject!=='全' && !pack.items.some(function(q){ return q.subject===subject; })){ subject='全'; savePref(); }
    startWith(pack, false);
    setStatus(SETS_UI[k].label+'に切替（保存済み '+pack.items.length+'問）', navigator.onLine);
    closePanel();
    /* ⚠ ここが 2026-08-19 に見つかった穴：
       **切替では取り直していなかった**。起動時に取り直すのは「そのとき選んでいた年度」だけなので、
       あとから令和6へ切り替えると、**何日前のパックでもそのまま使い続ける**（前提も状態の印も入らない）。
       → 保存分ですぐ解ける状態にしたうえで、オンラインなら**裏で取り直す**。 */
    if(navigator.onLine){ if(packIsOld_(pack)) warnOldPack_(); tryRefresh(false); }
    else if(packIsOld_(pack)){ warnOldPack_(); }
  } else if(navigator.onLine){
    tryRefresh(true);   // この端末に未保存→その場で取得
  } else {
    $('controls').classList.add('hidden');
    $('notice').classList.remove('hidden');
    $('notice').innerHTML='📵 '+SETS_UI[k].label+'は、まだこの端末に保存されていません。<br><b>電波のある場所で一度開いて取り込んでください。</b>';
    setStatus(SETS_UI[k].label+'（未取込）', false);
  }
}

function renderChips(){
  var host=$('subjChips'); host.innerHTML='';
  var all=['全'].concat(subjects());
  all.forEach(function(s){
    var c=el('button','chip'+(s===subject?' on':''), s);
    c.onclick=function(){ subject=s; savePref(); renderChips(); setSubjBtn(); buildList(); render(); closePanel(); };
    host.appendChild(c);
  });
}
function renderOrderSeg(){
  var seg=$('orderSeg');
  Array.prototype.forEach.call(seg.querySelectorAll('button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-mode')===order);
    b.onclick=function(){ order=b.getAttribute('data-mode'); savePref(); renderOrderSeg(); buildList(); render(); closePanel(); };
  });
}
function renderOnlySeg(){
  var seg=$('onlySeg');
  if(!seg) return;
  /* 印の無い古いパックのときは絞り込みを出さない（押しても何も起きないボタンを見せない）。
     🔄更新すれば印つきのパックが来る。 */
  var hasMark = !!(pack && pack.items && pack.items.length && pack.items[0].st);
  seg.style.display = hasMark ? '' : 'none';
  Array.prototype.forEach.call(seg.querySelectorAll('button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-only')===only);
    b.onclick=function(){ only=b.getAttribute('data-only'); savePref(); renderOnlySeg(); buildList(); render(); closePanel(); };
  });
}

/* ===== 1問の描画 ===== */
function render(){
  var host=$('cardHost'); host.innerHTML='';
  $('countText').textContent = reviewMode? ('間違い復習：'+list.length+'問')
    : (subject+(only==='yet'?'・◯2回未満':only==='reason'?'・根拠だけ':'')+'：'+list.length+'問');
  if(!list.length){
    host.appendChild(el('div','notice',
      only==='yet'    ? 'この科目は、◯が2回付いていない肢がありません。（残っているのは根拠だけ）' :
      only==='reason' ? 'この科目に「根拠だけ足りない肢」はありません。' :
                        'この科目には問題がありません。'));
    $('progText').textContent='🚃'+SETS_UI[curSet].short+' '+subject+'：0問'; $('barFill').style.width='0%';
    return;
  }
  if(idx>=list.length){
    var day=readDay(), qn=readQ().length+readTQ().length;
    var done=el('div','notice');
    done.innerHTML=(reviewMode? '🎉 きょうの間違い分をやり切りました。':'🎉 このセットは最後まで解きました。<br>上の「'+subject+' ▾」から科目を変えるか、シャッフルでもう一周できます。')
      +'<br><br>きょう '+day.n+'問（正解 '+day.ok+'）'+(qn>0?'　未送信 '+qn+'件':'　✅ 本体へ送信済み');
    host.appendChild(done);
    var rbtn=el('button','next','📊 きょうのリザルトを見る');
    rbtn.style.cssText='width:100%;margin-top:14px;padding:14px 0;border:none;border-radius:14px;font-size:16px;font-weight:800;';
    rbtn.onclick=showResult;
    host.appendChild(rbtn);
    $('progText').textContent = '🚃'+SETS_UI[curSet].short+' '+list.length+' / '+list.length+'　正解 '+correct+'/'+answered;
    $('barFill').style.width='100%';
    return;
  }
  var q=list[idx];
  $('progText').textContent = '🚃'+SETS_UI[curSet].short+' '+(idx+1)+' / '+list.length+'　正解 '+correct+'/'+answered;
  $('barFill').style.width = ((idx)/list.length*100)+'%';

  var card=el('div','card');
  var meta=el('div','meta');
  meta.appendChild(el('span','qname', q.name+'　'+q.eda));
  meta.appendChild(el('span','badge', q.subject));
  card.appendChild(meta);
  /* 前提（2026-08-19）＝肢だけでは「Ｂが誰か」が分からない肢を読むための設問文。
     本体アプリは v137 から出しているのに、**電車モードは出していなかった**
     （パックには 8/18 から載っていたのに、描く側を足し忘れていた＝社長「前提情報ないのつらい」）。
     置き場・見た目は本体の `.zentei` と同じ＝肢の**上に小さく**。無ければ何も出さない。 */
  if(q.zentei && String(q.zentei).trim()){
    var zbox=el('div','zentei');
    zbox.appendChild(el('b',null,'前提'));
    zbox.appendChild(document.createTextNode(String(q.zentei).trim()));
    card.appendChild(zbox);
  }
  card.appendChild(el('div','bun', q.bun));

  var ansrow=el('div','ansrow');
  var bm=el('button','ansbtn maru'); bm.innerHTML='◯<span class="sub">正しい</span>';
  var bb=el('button','ansbtn batsu'); bb.innerHTML='✕<span class="sub">誤り</span>';
  ansrow.appendChild(bm); ansrow.appendChild(bb);
  card.appendChild(ansrow);

  var revealed=false;
  function reveal(my){
    if(revealed) return; revealed=true;
    var ans=q.ans; var ok=(my===ans);
    (my==='○'?bm:bb).classList.add('pick');
    (ans==='○'?bb:bm).classList.add('dim');
    bm.onclick=null; bb.onclick=null;
    answered++; if(ok) correct++;
    recordLocal(q, my, ok);   // 端末に記録→電波があれば本体へ自動同期

    var rev=el('div','reveal');
    var v=el('div','verdict '+(ok?'ok':'ng'), (ok?'正解':'不正解')+'　正解は '+ans);
    rev.appendChild(v);

    // 手応えは**解説の上**（本体と同じ）。下に置くと画面外になって押されない
    rev.appendChild(tegotaeBox(q));

    rev.appendChild(el('div','lbl','解説'));
    if(q.exp && q.exp.trim()){ rev.appendChild(el('div','block', q.exp)); }
    else { rev.appendChild(el('div','block empty','（この肢の解説はまだありません）')); }

    rev.appendChild(el('div','lbl','根拠の一文'));
    if(q.reason && q.reason.trim()){ rev.appendChild(el('div','block reason', q.reason)); }
    else { rev.appendChild(el('div','block empty','（根拠はまだ書かれていません）')); }

    var nav=el('div','nav');
    var prev=el('button','prev','← 前へ'); prev.onclick=function(){ if(idx>0){ idx--; render(); } };
    var next=el('button','next', idx>=list.length-1?'おわり →':'次へ →'); next.onclick=function(){ idx++; render(); };
    if(idx===0) prev.disabled=true, prev.style.opacity=.4;
    nav.appendChild(prev); nav.appendChild(next);
    rev.appendChild(nav);
    card.appendChild(rev);
    rev.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  bm.onclick=function(){ reveal('○'); };
  bb.onclick=function(){ reveal('×'); };

  host.appendChild(card);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ===== きょうのリザルト画面 ===== */
function showResult(){
  closePanel();
  var host=$('cardHost'); host.innerHTML='';
  var day=readDay(), qn=readQ().length+readTQ().length, wrongs=wrongsNow();
  var rate = day.n? Math.round(day.ok/day.n*100) : 0;

  var sum=el('div','card');
  sum.appendChild(el('div','lbl','📊 きょうのリザルト'));
  var big=el('div'); big.style.cssText='font-size:26px;font-weight:900;margin:4px 0 2px;';
  big.textContent = day.n+'問　正解 '+day.ok+'（'+rate+'%）';
  sum.appendChild(big);
  var sub=el('div'); sub.style.cssText='font-size:14px;color:var(--sub);';
  sub.textContent = qn>0? '未送信 '+qn+'件（電波が入れば自動で本体へ）' : (day.n>0? '✅ 本体へ送信済み' : 'きょうはまだ解いていません');
  sum.appendChild(sub);
  host.appendChild(sum);

  var wc=el('div','card');
  wc.appendChild(el('div','lbl','❌ 間違えたままの肢（'+wrongs.length+'）'));
  if(!wrongs.length){
    var okmsg=el('div'); okmsg.style.cssText='font-size:17px;padding:6px 0;';
    okmsg.textContent = day.n? '全部解き直し済み（または全問正解）です 🎉' : '—';
    wc.appendChild(okmsg);
  } else {
    var pidx=packIndex_();
    wrongs.forEach(function(k, i){
      var q=pidx[k]; if(!q) return;
      var row=el('button','wrow');
      row.innerHTML='<span class="wname">'+q.name+'　'+q.eda+'</span>'+String(q.bun).slice(0,42)+'…';
      row.onclick=function(){ startWrongRound(i); };
      wc.appendChild(row);
    });
    var again=el('button','next','🔁 間違いだけもう一周（'+wrongs.length+'問）');
    again.style.cssText='width:100%;margin-top:12px;padding:14px 0;border:none;border-radius:14px;font-size:16px;font-weight:800;';
    again.onclick=function(){ startWrongRound(0); };
    wc.appendChild(again);
  }
  host.appendChild(wc);

  var back=el('button','prev','← 問題にもどる');
  back.style.cssText='width:100%;padding:14px 0;border-radius:14px;font-size:16px;font-weight:800;';
  back.onclick=function(){ render(); };
  host.appendChild(back);
  window.scrollTo({top:0, behavior:'smooth'});
}

/** きょうの間違いだけを出題リストにして解き直す（startIdx番目から） */
function startWrongRound(startIdx){
  var pidx=packIndex_();
  var items=wrongsNow().map(function(k){ return pidx[k]; }).filter(function(q){ return !!q; });
  if(!items.length){ showResult(); return; }
  reviewMode=true;
  list=items;
  idx=Math.min(startIdx||0, items.length-1);
  render();
}

/* ===== イベント ===== */
$('subjBtn').onclick=function(){ $('panel').classList.toggle('hidden'); updateSyncInfo(); };
$('resultBtn').onclick=function(){ if(pack) showResult(); };
$('refreshBtn').onclick=function(){ if(!navigator.onLine){ setStatus('オフラインです。電波がある所で更新を', false); return; } tryRefresh(!pack); syncNow(); };
window.addEventListener('online', function(){ setStatus('オンラインに復帰。未送信の解答を自動送信します', true); syncNow(); });
window.addEventListener('offline', function(){ setStatus('オフライン（保存済みで学習中）', false); updateSyncInfo(); });

/* ===== Service Worker 登録 ===== */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

boot();
renderSetSeg();
updateSyncInfo();
try{ $('foot').textContent += '　（' + BUILD + '）'; }catch(e){}
if(navigator.onLine) setTimeout(syncNow, 2000);  // 起動時に未送信があれば送る
</script>
