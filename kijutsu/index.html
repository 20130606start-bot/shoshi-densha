<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c5a86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="枠どり">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- ⛔ 外のフォントは読み込まない。**ネットが無いときに待たされる**（電車モードと同じ作り）。
     字の形は端末のヒラギノ／游に任せる＝正本のCSSに落とし先が書いてある -->
</head>
<body>
<title>枠どり練習帳</title>
<style>
:root{
  --ji:#17202e; --ji-usu:#5b6675; --ji-awa:#8a94a3;
  --kami:#f5f6f8; --kami-ue:#ffffff; --keisen:#dde1e8;
  --ai:#2c5a86; --ai-usu:#e8eff6;
  --shu:#a8412e; --shu-usu:#f8ece9;
  --midori:#2f6b4f; --midori-usu:#e7f1ec;
  --kage:0 1px 2px rgba(23,32,46,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ji:#e6e9ee; --ji-usu:#a3adbb; --ji-awa:#78828f;
  --kami:#14181f; --kami-ue:#1b212b; --keisen:#2b3341;
  --ai:#7fb2dd; --ai-usu:#1d2c3a;
  --shu:#e08d78; --shu-usu:#33221e;
  --midori:#7fc09c; --midori-usu:#1b2a23;
  --kage:0 1px 2px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --ji:#e6e9ee; --ji-usu:#a3adbb; --ji-awa:#78828f;
  --kami:#14181f; --kami-ue:#1b212b; --keisen:#2b3341;
  --ai:#7fb2dd; --ai-usu:#1d2c3a;
  --shu:#e08d78; --shu-usu:#33221e;
  --midori:#7fc09c; --midori-usu:#1b2a23;
  --kage:0 1px 2px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{
  background:var(--kami); color:var(--ji);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:19px; line-height:1.85; -webkit-text-size-adjust:100%;
}
.wrap{max-width:28rem; margin:0 auto; padding:0 16px 40px}
.mincho{font-family:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif}

/* 🔴🔴 2026-09-06 3度目の指摘でようやく直した。
   社長「もじがiPhoneで小さい。読む気にならんぐらい。**一問一答アプリと比較して**小さい」
   ⛔ 私は12.5px→15pxに上げて「直した」と報告した。**比べる相手を見ていなかった。**
   実測＝毎日読んでいる一問一答アプリ（shoshi-system\02-webapp\index.html）は
     肢の本文 .qbody = **23px** ／ 前提 .zentei = 23px ／ 解説 #qexp = 23px
     読み物 .readblock = 20〜23px ／ ボタン .btn = 19px
   ＝ **私の15pxは、社長の基準の3分の2しかなかった。**
   ⭐ **絶対値で決めない。社長が毎日読んでいるものに合わせる。**
      迷ったら index.html の .qbody を見る。それがこの会社の「読める大きさ」の定義。 */
header{padding:26px 0 12px}
/* ⚠ 2026-09-08 実測で直した。13px は「読めない」側（この会社の下限は14px、
   読ませたい文は20〜23px＝一問一答アプリの .qbody が基準）。ラベルでも13pxは切らない。 */
.eyebrow{font-size:15px; letter-spacing:.2em; color:var(--ai); font-weight:700}
h1{font-family:"Shippori Mincho",serif; font-size:27px; margin:8px 0 0; line-height:1.4; text-wrap:balance}
.sub{font-size:21px; color:var(--ji-usu); margin:6px 0 0; line-height:1.8}
/* ⭐ 2026-09-06 社長の指摘で全体を上げた＝「iPhoneでフォントが極端に小さくて見にくい」。
   実測すると、いちばん読み込む別紙の明細が12.5px、甲区/乙区の札が11pxだった。
   ⛔ **読み落としを防ぐ練習なのに、読む文がいちばん小さい**という逆の作りになっていた。
   iOSの本文は17pxが標準。ここは登記記録という密度の高い文なので、下限を14.5pxに置く。 */
.michi{display:flex; gap:6px; margin:16px 0 4px}
.michi i{flex:1; height:3px; background:var(--keisen); border-radius:2px}
.michi i.on{background:var(--ai)}

.modoru{
  font:inherit; font-size:17px; background:none; border:0; color:var(--ai);
  padding:10px 0; cursor:pointer; display:inline-flex; align-items:center; gap:5px;
}
.modoru:focus-visible{outline:2px solid var(--ai); outline-offset:2px}

.card{background:var(--kami-ue); border:1px solid var(--keisen); border-radius:3px; padding:15px; margin:14px 0; box-shadow:var(--kage)}
.card h2{font-family:"Shippori Mincho",serif; font-size:21px; margin:0 0 2px}
.card .meta{font-size:20px; color:var(--ji-usu); letter-spacing:.04em; margin-bottom:8px; line-height:1.8}

/* ── 棚（問を選ぶ）───────────────────────────── */
.tana{display:flex; flex-direction:column; gap:10px; margin-top:6px}
button.hon{
  font:inherit; text-align:left; width:100%; cursor:pointer;
  background:var(--kami-ue); color:var(--ji); border:1px solid var(--keisen);
  border-left:3px solid var(--ai); border-radius:3px; padding:13px 14px;
  display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center;
  box-shadow:var(--kage); transition:border-color .12s;
}
button.hon:hover{border-color:var(--ai); border-left-color:var(--ai)}
button.hon:focus-visible{outline:2px solid var(--ai); outline-offset:2px}
button.hon .na{grid-column:1; grid-row:1; font-family:"Shippori Mincho",serif; font-size:22px; font-weight:700}
button.hon .bu{grid-column:1; grid-row:2; font-size:20px; color:var(--ji-usu)}
button.hon .jyou{
  grid-column:2; grid-row:1 / span 2; justify-self:end; align-self:center;
  font-size:16px; font-variant-numeric:tabular-nums;
  padding:4px 9px; border-radius:2px; white-space:nowrap;
  background:var(--kami); color:var(--ji-awa); border:1px solid var(--keisen);
}
button.hon .jyou.sunda{background:var(--midori-usu); color:var(--midori); border-color:var(--midori)}
button.hon .jyou.nokori{background:var(--shu-usu); color:var(--shu); border-color:var(--shu)}

/* ── 集計（積み上げ）─────────────────────────── */
.tsumi{margin-top:6px}
.tsumi .r{display:grid; grid-template-columns:8.4em 1fr 2.4em; gap:0 8px; align-items:center; padding:8px 0; font-size:20px}
.tsumi .bou{height:10px; background:var(--kami); border-radius:2px; overflow:hidden}
.tsumi .bou i{display:block; height:100%; background:var(--shu); border-radius:2px}
.tsumi .kaz{text-align:right; font-variant-numeric:tabular-nums; color:var(--ji-usu)}
.tsumi .ichiban{color:var(--shu); font-weight:700}
.karappo{font-size:20px; color:var(--ji-usu); line-height:1.85}

/* ── 登記記録＝順位番号の欄を縦に積む（横スクロールさせない）── */
.touki{border-top:1px solid var(--ji)}
.touki .g{display:grid; grid-template-columns:42px 1fr; gap:0 10px; padding:14px 0; border-bottom:1px solid var(--keisen)}
.touki .no{font-family:"Shippori Mincho",serif; font-weight:700; font-size:19px; color:var(--ai); font-variant-numeric:tabular-nums; line-height:1.6}
.touki .mk{font-size:22px; font-weight:700; line-height:1.6}
.touki small{display:block; color:var(--ji); font-size:21px; line-height:1.9; margin-top:6px}
.hyodai{font-size:20px; color:var(--ji); padding:12px 0; border-bottom:1px solid var(--keisen); line-height:1.9}
.kuku{font-size:16px; letter-spacing:.1em; color:var(--ai); margin:16px 0 0; font-weight:700}

/* ── 親族関係図 ─────────────────────────────────
   🔴 2026-09-06 社長「親族関係図が見にくい。実物もこれ？横書きにした？
     なんか別物の表になっていると思う。これぐらいも忠実な表にできないの？」
   ＝ **実物は横書きのリストではない。**二重線（婚姻）と一本線（親子）でつないだ**家系図**。
     私は縦に字を並べたものに置き換えていた。**忠実ではなかった。**
   ⭐ だから図として描き直した（SVG）。線の意味も原文の注のまま残す。
     ⚠ 生年月日だけは図の中に入れると375pxで潰れるので、図のすぐ下に**原文のまま**並べた。 */
.kakeizu{width:100%; height:auto; display:block; margin:12px 0 2px}
/* ⭐⭐ 2026-09-08 社長「原本通りじゃない気がする。文字の位置が違うんでしょ？最初と一緒だよ」
   ＝ そのとおりだった。原本は**日付が各人の右に並ぶ**が、私は下の一覧に出していた＝別の図。
   ⛔ **描き直すのをやめた。**原本のPDF(p.43)を画像にして、そのまま載せる。
      pdftoppm -png -r 200 -f 43 -l 43 -x 150 -y 515 -W 1420 -H 640
   ＝ **もう二度とずれない。**（3回描き直して3回とも違った。写せるものは写す）
   ⚠ 375pxでは字が小さいので、**タップで大きく**できるようにした。文字の一覧も下に残す。 */
.genpon{width:100%; height:auto; display:block; background:#fff; border:1px solid var(--keisen);
        border-radius:3px; margin:12px 0 4px; cursor:zoom-in}
.genpon-atsui{position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:50;
        overflow:auto; -webkit-overflow-scrolling:touch; padding:0; display:block}
.genpon-atsui img{width:auto; max-width:none; height:auto; display:block; background:#fff}
.genpon-tojiru{position:fixed; right:12px; top:12px; z-index:51; font:inherit; font-size:20px;
        font-weight:700; background:#fff; color:#111; border:0; border-radius:4px; padding:12px 18px; cursor:pointer}
.zunote{font-size:20px; color:var(--ji-usu); line-height:1.75; margin:6px 0 14px}
.seibotsu{font-size:21px; line-height:1.95; border-top:1px solid var(--keisen); padding-top:12px}
.seibotsu div{display:flex; gap:10px; padding:3px 0}
.seibotsu b{font-family:"Shippori Mincho",serif; font-size:21px; flex:none; width:1.4em}
/* 「死亡 令和5|年7月1日」と途中で折れないよう、ひとかたまりで送る */
.seibotsu em{font-style:normal; color:var(--shu); font-weight:700; white-space:nowrap}
.seibotsu span{display:flex; flex-wrap:wrap; gap:0 12px}

ol.chouju{margin:6px 0 0; padding-left:1.2em; font-size:21px; line-height:1.9}
ol.chouju li{margin:14px 0}

.rule{background:var(--ai-usu); border-left:3px solid var(--ai); padding:15px 16px; font-size:21px; line-height:1.9; margin:18px 0}
.rule b{color:var(--ai)}

.toi{font-size:21px; font-weight:700; margin:26px 0 12px; line-height:1.7}
.fuda{display:flex; flex-direction:column; gap:8px}
button.f{
  font:inherit; font-size:20px; text-align:left; line-height:1.6;
  background:var(--kami-ue); color:var(--ji); border:1px solid var(--keisen); border-radius:3px;
  padding:16px 14px 16px 50px; cursor:pointer; position:relative; transition:border-color .12s,background .12s;
}
button.f:hover{border-color:var(--ai)}
button.f:focus-visible{outline:2px solid var(--ai); outline-offset:2px}
button.f .no{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  width:27px; height:27px; border-radius:50%; border:1px solid var(--keisen);
  display:grid; place-items:center; font-size:16px; font-weight:700; color:var(--ji-awa); font-variant-numeric:tabular-nums;
}
button.f.erabu{border-color:var(--ai); background:var(--ai-usu)}
button.f.erabu .no{background:var(--ai); border-color:var(--ai); color:#fff}
button.f:disabled{cursor:default; opacity:.75}
button.f.seikai{border-color:var(--midori); background:var(--midori-usu)}
button.f.machigai{border-color:var(--shu); background:var(--shu-usu)}

.kensu{display:flex; gap:8px; margin:10px 0}
.kensu button{flex:1; font:inherit; font-size:26px; font-weight:700; padding:16px 0; background:var(--kami-ue); color:var(--ji); border:1px solid var(--keisen); border-radius:3px; cursor:pointer; font-variant-numeric:tabular-nums}
.kensu button:hover{border-color:var(--ai)}
.kensu button:focus-visible{outline:2px solid var(--ai); outline-offset:2px}

.susumu{display:block; width:100%; font:inherit; font-size:20px; font-weight:700; background:var(--ai); color:#fff; border:0; border-radius:3px; padding:19px 0; margin-top:20px; cursor:pointer}
.susumu:disabled{background:var(--keisen); color:var(--ji-awa); cursor:default}
.susumu:focus-visible{outline:2px solid var(--ji); outline-offset:2px}
.susumu.usui{background:var(--kami-ue); color:var(--ai); border:1px solid var(--ai)}

.kotae .gyou{display:grid; grid-template-columns:32px 1fr; gap:0 8px; padding:16px 0; border-bottom:1px solid var(--keisen); font-size:21px; line-height:1.7}
.kotae .gyou:last-child{border-bottom:0}
.kotae .mark{font-weight:700; font-size:23px}
.kotae .maru{color:var(--midori)} .kotae .batsu{color:var(--shu)}
.kotae small{display:block; color:var(--ji); font-size:19px; line-height:1.9; margin-top:8px}
.kotae .anata{display:block; color:var(--shu); font-size:18px; margin-top:6px}

.riyuu{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.riyuu button{font:inherit; font-size:18px; padding:12px 16px; border-radius:2px; background:var(--kami-ue); color:var(--ji); border:1px solid var(--keisen); cursor:pointer}
.riyuu button.erabu{background:var(--shu); border-color:var(--shu); color:#fff}
.riyuu button:focus-visible{outline:2px solid var(--ai); outline-offset:2px}

.daichou{background:var(--kami-ue); border:1px solid var(--keisen); border-radius:3px; overflow-x:auto; box-shadow:var(--kage)}
.daichou table{border-collapse:collapse; width:100%; min-width:20rem}
.daichou th,.daichou td{padding:12px 13px; font-size:17px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--keisen); font-variant-numeric:tabular-nums}
.daichou th{font-size:15px; color:var(--ji-usu); letter-spacing:.06em}
.daichou tr:last-child td{border-bottom:0}

/* ── 窓口＝「ここが変だ」を押して伝える ──────────────
   🔴 2026-09-06 社長「不具合としてiPhoneで報告しようとしたが、いみわからん」
     ＝ 前の版は**押した場所を控えるだけ**で、**何が変なのかを一度も聞いていなかった。**
       そのうえ機械の1行（日付＋問＋段）を見せていた。**意味が分からなくて当然。**
   ⭐ 直し方＝**「どこが変ですか」と日本語で聞いて、近いものを1つ押してもらう。**
     場所（いつ・どの問・どの段）は道具が勝手に付ける＝社長は何も打たなくていい。 */
.kizuki{margin-top:30px; padding-top:18px; border-top:1px dashed var(--keisen)}
button.kizuki-b{
  font:inherit; font-size:19px; width:100%; padding:17px 0; cursor:pointer;
  background:var(--kami-ue); color:var(--shu); border:1px dashed var(--shu); border-radius:3px;
}
button.kizuki-b:focus-visible{outline:2px solid var(--shu); outline-offset:2px}
.kizuki-hako{background:var(--shu-usu); border-left:3px solid var(--shu); border-radius:3px; padding:16px}
.kizuki-toi{font-size:20px; font-weight:700; margin:0 0 4px}
.kizuki-doko{font-size:16px; color:var(--ji-usu); margin-bottom:12px; line-height:1.7}
.kizuki-nani{display:flex; flex-direction:column; gap:9px}
.kizuki-nani button{
  font:inherit; font-size:19px; text-align:left; line-height:1.6; padding:15px 16px; cursor:pointer;
  background:var(--kami-ue); color:var(--ji); border:1px solid var(--keisen); border-radius:3px;
}
.kizuki-nani button:focus-visible{outline:2px solid var(--shu); outline-offset:2px}
.kizuki-nani button.erabu{background:var(--shu); border-color:var(--shu); color:#fff}
/* 🔴 2026-09-06 社長「なにがおかしかったか **書かせてよ**。選べるけど書けないじゃん」
   ＝ 札で選ぶ形だけにして、**書く場所を用意していなかった。**
   ⭐ 選ぶのは「急いでいるとき用」。**書きたいときに書けないのは、窓口ではない。** */
.kizuki-kaku{
  font:inherit; font-size:19px; line-height:1.7; width:100%; margin-top:14px; padding:14px;
  min-height:6.5em; resize:vertical;
  background:var(--kami-ue); color:var(--ji); border:1px solid var(--keisen); border-radius:3px;
}
.kizuki-kaku:focus-visible{outline:2px solid var(--shu); outline-offset:1px}
.kizuki-oku{
  font:inherit; font-size:20px; font-weight:700; width:100%; margin-top:12px; padding:17px 0;
  background:var(--shu); color:#fff; border:0; border-radius:3px; cursor:pointer;
}
.kizuki-oku:disabled{background:var(--keisen); color:var(--ji-awa); cursor:default}
.kizuki-yame{
  font:inherit; font-size:17px; width:100%; margin-top:14px; padding:12px 0; cursor:pointer;
  background:none; border:0; color:var(--ji-usu);
}
.kizuki-ok{
  font-size:19px; color:var(--midori); font-weight:700; line-height:1.9;
  background:var(--midori-usu); border-left:3px solid var(--midori); border-radius:3px; padding:16px;
}
.kizuki-hitotsu{
  font-size:18px; line-height:1.8; background:var(--shu-usu); border:1px solid var(--shu);
  border-radius:3px; padding:13px 15px; margin-top:10px;
  -webkit-user-select:all; user-select:all;
}

/* ── 別紙1枚ごとの窓口（2026-09-06 社長の案）──────────────
   ⭐ 「別紙2の親族関係図が変」を伝えるのに、今日は何往復もかかった。
     カードごとにボタンがあれば**1タップで場所が確定する。**
   ⚠ 解いている最中の邪魔にならないよう、**小さく・右寄せ・薄く**。
     ただし指で押せる高さ（44px前後）は確保する。 */
.kizuki-naka{margin-top:16px; text-align:right}
.card-kizuki{
  display:inline-block; width:auto; font:inherit; font-size:15px; line-height:1.4;
  background:none; border:1px dashed var(--keisen); border-radius:3px;
  color:var(--ji-awa); padding:10px 15px; cursor:pointer; white-space:nowrap;
}
.card-kizuki:hover{border-color:var(--shu); color:var(--shu)}
.card-kizuki:focus-visible{outline:2px solid var(--shu); outline-offset:2px}
.kizuki-naka .kizuki-hako{margin-top:4px; text-align:left}
.kizuki-naka .kizuki-ok, .kizuki-naka .kizuki-hitotsu{text-align:left}

.chui{background:var(--shu-usu); border-left:3px solid var(--shu); padding:15px 16px; font-size:19px; line-height:1.9; margin:18px 0}
.memo{font-size:20px; color:var(--ji-usu); line-height:1.85; margin-top:24px; padding-top:16px; border-top:1px solid var(--keisen)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <div class="eyebrow">層2 ／ 枠だけ・10分</div>
  <h1 class="mincho">枠どり練習帳</h1>
  <p class="sub" id="sub">決めるのは<strong>件数・順序・登記の目的</strong>だけ。書く欄はありません。</p>
  <div class="michi" id="michi"></div>
</header>
<div id="butai"></div>
</div>

<script>
/* ============================================================
   問（層2の素材）。⛔ 本文は令和7年司法書士試験問題 午後の部 から起こしたもの
   ============================================================ */
const RIYUU = ["①読み落とし","②論点知識","③枠ずれ","④添付情報","⑤書き方・時間"];

const MON = [
{
  id:"r7-36-1", na:"令和7 第36問 設例1", buk:"甲土地（前橋地方法務局太田支局）",
  deru:"令和7年7月4日に申請　／　書面申請",
  syutten:"令和7年司法書士試験問題 午後の部 p.36〜43（別紙1〜3）",
  junjo:"原因日付が R2.8.8 → R5.7.1 → R7.6.3 の順（注意事項5⑴）",

(async function tsunagu_db(){
  try{
    if(!window.claude || !window.claude.use) return;
    const d = await window.claude.use("db");
    if(!d) return;                       /* 使えない場＝端末の中だけで動く（それでも壊れない） */
    DB = d;
    const [k1, k2] = await Promise.all([
      DB.doc(DBOC.kiroku).get().catch(function(){ return {exists:false}; }),
      DB.doc(DBOC.kizuki).get().catch(function(){ return {exists:false}; })
    ]);
    /* 端末に在るものと、貯まっているものを混ぜる（同じ日・同じ問は1件に畳む） */
    if(k1 && k1.exists){
      const soto = (k1.data().list) || [];
      const uchi = yomu();
      const mita = {};
      const awase = soto.concat(uchi).filter(function(r){
        const key = r.t + "|" + r.id + "|" + r.atari;
        if(mita[key]) return false; mita[key] = 1; return true;
      }).sort(function(a,b){ return String(a.t).localeCompare(String(b.t)); });
      try{ localStorage.setItem(KAGI, JSON.stringify(awase.slice(-200))); }catch(e){}
    }
    if(k2 && k2.exists){
      const soto2 = (k2.data().list) || [];

  }catch(e){ /* 使えなければ端末の中だけで動く */ }
})();

           const n=S.erabi.indexOf(m); let c = n>=0?"erabu":"";
           if(owatta){ if(n>=0) c += (seikai[n]===m?" seikai":" machigai"); else if(seikai.indexOf(m)>=0) c += " machigai"; }
           return '<button class="f '+c+'"'+(owatta?" disabled":"")+' data-m="'+esc(m)+'"><span class="no">'+(n>=0?n+1:"")+'</span>'+esc(m)+'</button>';
         }).join("")+'</div>';
    if(!owatta) h += '<button class="susumu" id="awase"'+(S.erabi.length?"":" disabled")+'>答え合わせ（'+S.erabi.length+'件）</button>';
  }

  if(S.dan==="kotae"){
    h += '<div class="card"><h2>正解の枠</h2><div class="kotae">'
      + M.kotae.map(function(k,n){
          const a = S.erabi[n]===k.m;
          return '<div class="gyou"><span class="mark '+(a?"maru":"batsu")+'">'+(a?"○":"×")+'</span><div>'
            + '<b>'+(n+1)+'　'+esc(k.m)+'</b>'
            + '<small>'+esc(k.g)+'　／　'+esc(k.z)+'</small><small>'+k.w+'</small>'
            + (a?"":'<span class="anata">あなた：'+esc(S.erabi[n]||"（立てていない）")+'</span>')+'</div></div>';
        }).join("")
      + '</div><div class="meta" style="margin-top:10px">順序の根拠＝'+M.junjo+'</div></div>';
    const machi = M.kotae.filter(function(k,n){return S.erabi[n]!==k.m;}).length;
    if(machi) h += '<p class="toi">外した理由を1つ選んでください。</p><div class="riyuu">'
      + RIYUU.map(function(r){return '<button class="'+(S.riyuu===r?"erabu":"")+'" data-r="'+r+'">'+r+'</button>';}).join("")+'</div>';
    h += '<button class="susumu" id="tsugi"'+((machi&&!S.riyuu)?" disabled":"")+'>記録して終わる</button>';
  }

  butai.innerHTML = h + kizukiBlock(); kizukiUmeru(); tsunagu();
}

/** 「変だ」を控える。⛔ 直さない・送らない。**残すだけ**（私が次に読む） */
function kizukiIre(nani, memo){
  const bits = [];
  if(nani) bits.push(nani);
  if(memo) bits.push("「"+memo+"」");
  const line = hizuke()+"　"+ima()+"　→　"+bits.join("　");
  const a = kizukiYomu();
  a.push({t:hizuke(), id:(S.mon?S.mon.id:""), doko:ima(), nani:nani||"", memo:memo||"", line:line});
  S.kizukiOK = kizukiKaku(a);
  S.kizukiAku = false; S.kizukiNani = null; S.kizukiMemo = "";
  S.kizukiSunda = line;
  egaku();
}

/** 窓口のボタンをつなぐ（どの画面でも同じ形なので1つにまとめる）
    ⚠ 札を押すたびに描き直すと**書きかけの文が消える**。だから札はDOMだけ塗り替える。 */
function kizukiTsunagu(){
  const k = butai.querySelector("#kizuki");
  if(k) k.onclick = function(){ S.kizukiAku = true; S.kizukiSunda = null; S.kizukiCard = null; egaku(); };
  /* 別紙ごとのボタン。押したその場に箱が開く（画面のいちばん下まで戻らせない） */
  butai.querySelectorAll("[data-card]").forEach(function(b){
    b.onclick = function(){
      S.kizukiCard = b.dataset.card; S.kizukiAku = true; S.kizukiSunda = null;
      S.kizukiNani = null; S.kizukiMemo = "";
      egaku();
      const ta = butai.querySelector("#kizukiMemo");
      if(ta){ ta.scrollIntoView({block:'center'}); ta.focus(); }
    };
  });
  const y = butai.querySelector("#kizukiYame");
  if(y) y.onclick = function(){ S.kizukiAku = false; S.kizukiNani = null; S.kizukiMemo = ""; S.kizukiCard = null; egaku(); };

  const memo = butai.querySelector("#kizukiMemo");
  const oku  = butai.querySelector("#kizukiOku");
  const naoru = function(){
    S.kizukiMemo = memo ? memo.value.trim() : "";
    if(oku) oku.disabled = !(S.kizukiNani || S.kizukiMemo);
  };
  if(memo) memo.oninput = naoru;

  butai.querySelectorAll("[data-nani]").forEach(function(b){
    b.onclick = function(){
      const cur = b.dataset.nani;
      butai.querySelectorAll("[data-nani]").forEach(function(x){ x.classList.remove("erabu"); });
      if(S.kizukiNani === cur){ S.kizukiNani = null; }
      else { S.kizukiNani = cur; b.classList.add("erabu"); }
      naoru();
    };
  });
  if(oku) oku.onclick = function(){
    kizukiIre(S.kizukiNani, memo ? memo.value.trim() : "");
  };
}

/* 原本の図をタップで大きく。⭐ iPhoneでは指で広げられるので、原寸で出して自由に動かせれば足りる */
function genponTsunagu(){
  butai.querySelectorAll(".genpon").forEach(function(gp){
    gp.onclick = function(){
      const o = document.createElement("div"); o.className = "genpon-atsui";
      const im = document.createElement("img"); im.src = gp.src; im.alt = gp.alt || "原本";
      o.appendChild(im);
      const b = document.createElement("button"); b.className = "genpon-tojiru"; b.textContent = "閉じる";
      const kesu = function(){ o.remove(); b.remove(); };
      b.onclick = kesu;
      o.onclick = function(e){ if(e.target === o) kesu(); };
      document.body.appendChild(o); document.body.appendChild(b);
    };
  });
}

function tsunagu(){
  kizukiTsunagu(); genponTsunagu();
  const b0 = butai.querySelector("#modoru");
  if(b0) b0.onclick = function(){ S.men="tana"; S.kizukiSunda=null; S.kizukiAku=false; S.kizukiCard=null; window.scrollTo(0,0); egaku(); };
  butai.querySelectorAll("[data-ken]").forEach(function(b){ b.onclick=function(){ S.dan="erabu"; S.kizukiSunda=null; S.kizukiAku=false; S.kizukiCard=null; egaku(); }; });
  butai.querySelectorAll("[data-m]").forEach(function(b){ b.onclick=function(){
    const m=b.dataset.m, n=S.erabi.indexOf(m);
    if(n>=0) S.erabi.splice(n,1); else S.erabi.push(m);
    egaku();
  };});
  const a=butai.querySelector("#awase"); if(a) a.onclick=function(){ S.dan="kotae"; S.kizukiSunda=null; S.kizukiAku=false; S.kizukiCard=null; egaku(); };
  butai.querySelectorAll("[data-r]").forEach(function(b){ b.onclick=function(){ S.riyuu=b.dataset.r; egaku(); }; });
  const t=butai.querySelector("#tsugi"); if(t) t.onclick=function(){
    const M=S.mon;
    const atari = M.kotae.filter(function(k,n){return S.erabi[n]===k.m;}).length;
    const rec = yomu();
    rec.push({t:hizuke(), id:M.id, na:M.na, atari:atari, zen:M.kotae.length, riyuu:(atari===M.kotae.length?null:S.riyuu)});
    S.hozon = kaku(rec);
    S.dan="owari"; S.kizukiSunda=null; S.kizukiAku=false; S.kizukiCard=null; window.scrollTo(0,0); egaku();
  };
}

function owari(){
  const M=S.mon;
  const rows = M.kotae.map(function(k,n){ return {no:n+1, m:k.m, ok:S.erabi[n]===k.m}; });
  const atari = rows.filter(function(r){return r.ok;}).length;
  let h = '<button class="modoru" id="modoru">← 棚にもどる</button>'
    + '<div class="card"><h2>今日の記録</h2><div class="meta">'+esc(M.na)+'　'+atari+' / '+M.kotae.length+' 件　'+hizuke()+'</div></div>'
    + '<div class="daichou"><table><tr><th>件</th><th>登記の目的</th><th></th><th>理由</th></tr>'
    + rows.map(function(r){ return '<tr><td>'+r.no+'</td><td>'+esc(r.m)+'</td>'
        +'<td style="color:'+(r.ok?"var(--midori)":"var(--shu)")+';font-weight:700">'+(r.ok?"○":"×")+'</td>'
        +'<td>'+(r.ok?"—":esc(S.riyuu||"—"))+'</td></tr>'; }).join("")+'</table></div>';
  h += (atari===M.kotae.length)
    ? '<div class="chui" style="background:var(--midori-usu);border-color:var(--midori)">'+M.kotae.length+'件そろいました。<b>この問は層3（中身）に進んでよい日</b>です。原因日付・添付情報・登録免許税を1件だけ書いてみてください。</div>'
    : '<div class="chui">外した理由を <b>'+esc(S.riyuu||"—")+'</b> として記録しました。<br>これが20問ぶん溜まると「<b>失点の6割は読み落とし</b>」のように、直す場所が1つに決まります。</div>';
  if(S.hozon===false) h += '<div class="chui">⚠ この端末のブラウザに記録を残せませんでした（プライベートモードなどでは残りません）。<b>数字だけ紙に控えてください。</b></div>';
  h += '<button class="susumu usui" id="tana2">棚にもどる</button>';
  h += '<p class="memo">ここまでで<strong>10分</strong>。書いたのは3行だけ。<br>本試験の記述式の点の大半を占める「枠」を、1問ぶん練習したことになります。</p>';
  butai.innerHTML = h + kizukiBlock();
  const b0=butai.querySelector("#modoru"), b1=butai.querySelector("#tana2");
  const modoru = function(){ S.men="tana"; S.kizukiSunda=null; S.kizukiAku=false; S.kizukiCard=null; window.scrollTo(0,0); egaku(); };
  if(b0) b0.onclick=modoru; if(b1) b1.onclick=modoru;
  kizukiTsunagu();
}

/* ── 棚（最初の画面）───────────────────────── */
function tana(){
  sub.innerHTML = '決めるのは<strong>件数・順序・登記の目的</strong>だけ。書く欄はありません。';
  michi.innerHTML = "";
  const rec = yomu();
  const saigo = {};
  rec.forEach(function(r){ saigo[r.id] = r; });

  let h = '<p class="toi" style="margin-top:14px">今日の1問を選ぶ</p><div class="tana">'
    + MON.map(function(m){
        const r = saigo[m.id];
        const zen = r && r.atari===r.zen;
        const jyou = r ? (r.atari+" / "+r.zen) : "はじめて";
        const cls = r ? (zen ? "sunda" : "nokori") : "";
        return '<button class="hon" data-id="'+m.id+'">'
          + '<span class="na">'+esc(m.na)+'</span>'
          + '<span class="jyou '+cls+'">'+jyou+'</span>'
          + '<span class="bu">'+esc(m.buk)+'</span></button>';
      }).join("") + '</div>';

  /* 積み上げ＝この道具の本体。理由の集計が「直す場所」を1つに決める */
  const nuke = rec.filter(function(r){ return r.riyuu; });
  h += '<div class="card"><h2>積み上げ</h2><div class="meta">'
    + (rec.length ? rec.length+'回ぶん　／　外した理由の内わけ' : 'まだ1回も解いていません')+'</div>';
  if(nuke.length){
    const kaz = RIYUU.map(function(r){ return {r:r, n:nuke.filter(function(x){return x.riyuu===r;}).length}; });
    const max = Math.max.apply(null, kaz.map(function(k){return k.n;}));
    h += '<div class="tsumi">' + kaz.map(function(k){
      const w = max ? Math.round(k.n/max*100) : 0;
      return '<div class="r"><span'+(k.n&&k.n===max?' class="ichiban"':'')+'>'+k.r+'</span>'
        + '<span class="bou"><i style="width:'+w+'%"></i></span>'
        + '<span class="kaz">'+k.n+'</span></div>';
    }).join("") + '</div>';
  }else{
    h += '<p class="karappo">解き終えると、外した理由（①〜⑤）がここに積み上がります。'
      + '<b>20問ぶん溜まると、直す場所が1つに決まります。</b><br>'
      + '⚠ 記録はこの端末のブラウザの中だけです。端末をまたぎません。</p>';
  }
  h += '</div>';

  /* 窓口②にたまったもの＝私に見せる用。⛔ 自動では送らない */
  const kiz = kizukiYomu();
  if(kiz.length){
    h += '<div class="card"><h2>気になったところ</h2>'
      + '<div class="meta">'+kiz.length+'件</div>'
      + kiz.slice(-10).reverse().map(function(k){
          return '<div class="kizuki-hitotsu">'+esc(k.line || (k.t+"　"+(k.doko||"")))+'</div>';
        }).join("")
      /* 🔴 2026-09-07 社長がここから報告されたのに、**私に届かなかった。**
         控えは端末の localStorage に貯まるだけで、線が繋がっていなかった。
         ⭐ 教訓＝**窓口は「押せること」ではなく「届くこと」。**
         いちばん安い直し＝**1タップで全文をコピー**。あとは社長が貼るだけで届く。 */
      + '<button class="susumu" id="kizukiCopy">📋 まとめてコピー（貼れば私に届きます）</button>'
      + '<p class="karappo" style="margin-top:14px">押すと全部の控えが写ります。'
      + '<b>チャットに貼るだけ</b>で、どこの話か分かります。'
      + '（写せないときは、この画面を撮って送ってください）</p>'
      + '<button class="susumu usui" id="kizukiKesu">この一覧を消す</button></div>';
  }

  if(rec.length){
    h += '<div class="daichou"><table><tr><th>日</th><th>問</th><th>点</th><th>理由</th></tr>'
      + rec.slice(-10).reverse().map(function(r){
          return '<tr><td>'+r.t+'</td><td>'+esc(r.na)+'</td><td>'+r.atari+'/'+r.zen+'</td><td>'+esc(r.riyuu||"—")+'</td></tr>';
        }).join("") + '</table></div>';
  }

  h += '<div class="rule"><b>変だと思ったときは</b><br>'
    + 'どの画面でも、いちばん下の <b>「⚠ 変だと思ったら、ここを押す」</b> を押してください。<br>'
    + '<b>「どこが変ですか？」</b>と聞かれるので、近いものを1つ押すだけです。'
    + '<span style="color:var(--ji-usu)">（どの問の、どの場面かは自動で付きます）</span><br>'
    + '<b>思ったことをそのまま書けます。</b>急ぐときは札を押すだけでもかまいません。'
    + '<span style="color:var(--ji-usu)">（どの問の、どの場面かは自動で付きます）</span><br>'
    + 'たまったものは、この画面の「気になったところ」に出ます。'
    + '<b>その画面を撮って私に送ってください。</b></div>';

  h += '<p class="memo">出典＝令和7年司法書士試験問題 午後の部（別紙は原文から起こしています）。<br>'
    + '層2は「枠だけ・10分」。⛔ 通しで解くのは月1〜2回（層4）でよい、というのが今の方針です。<br>'
    /* 🔴 2026-09-12 社長「この記述式関連 <b>オフラインアプリで進める</b> で認識してほしい。
       連続して進めることができる、ネット接続関係なしにサクサク、集中してできるもの」
       ＝ 2026-09-06 の「一問一答アプリの中に入れる」は、社長ご自身が変更された。
       ⛔ ここに「アプリの中へ入れます」と書き続けると、社長に**古い方針を読ませる**ことになる。 */
    + '⚠ これは<b>オフラインで動くアプリ</b>です。2回目からは<b>ネットが無くても開きます</b>。'
    + 'ホーム画面に追加しておくと、電車の中でもそのまま続けられます。</p>';

  butai.innerHTML = h;
  const kk = butai.querySelector("#kizukiKesu");
  if(kk) kk.onclick = function(){ kizukiKaku([]); egaku(); };
  /* 1タップで全部写す。⚠ iOSは許可が要ることがあるので、写せなければ選択状態にして知らせる */
  const kc = butai.querySelector("#kizukiCopy");
  if(kc) kc.onclick = function(){
    const moji = kizukiYomu().map(function(k){ return k.line || (k.t+"　"+(k.doko||"")); }).join("\n");
    const owari = function(ok){
      kc.textContent = ok ? "✅ 写しました。チャットに貼ってください" : "⚠ 写せません。長押しで選んでコピーしてください";
      setTimeout(function(){ kc.textContent = "📋 まとめてコピー（貼れば私に届きます）"; }, 4000);
    };
    try{
      navigator.clipboard.writeText(moji).then(function(){ owari(true); }, function(){ owari(false); });
    }catch(e){ owari(false); }
  };
  butai.querySelectorAll("[data-id]").forEach(function(b){
    b.onclick = function(){
      S.mon = MON.filter(function(m){return m.id===b.dataset.id;})[0];
      S.men="mon"; S.dan="jian"; S.erabi=[]; S.fuda=null; S.riyuu=null; S.hozon=null; S.kizukiLine=null;
      window.scrollTo(0,0); egaku();
    };
  });
}

egaku();
</script>

   ⛔ この外枠の中にバッククォートを書かないこと（組み立てが途中で切れる・2026-09-12に踏んだ） */
